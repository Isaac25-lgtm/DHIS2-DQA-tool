# Render Blueprint for the UCMB HMIS 105 DQA Platform.
#
# Database is EXTERNAL Neon Postgres - Render does not provision the database.
# Provide the full Neon connection string (with ?sslmode=require) via the
# DATABASE_URL env var in the Render dashboard during Blueprint apply.
#
# See README.md "Deploy to Render with Neon Postgres" for the full guide.

services:
  - type: web
    name: ucmb-dqa-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "UCMB HMIS 105 DQA Platform"
      - key: APP_VERSION
        value: "0.6.0"
      - key: ENVIRONMENT
        value: "production"
      # Paste your Neon pooled connection string in the Render dashboard.
      # Example: postgresql://USER:PASSWORD@ep-xxxxxxx-pooler.REGION.aws.neon.tech/ucmb_dqa?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DHIS2_BASE_URL
        value: "https://hmis.health.go.ug/api"
      # DHIS2 sign-in is performed by managers from the in-app Settings page; the password is held
      # only in backend process memory. DHIS2_USERNAME / DHIS2_PASSWORD env vars are intentionally
      # NOT defined here. If you ever want backend-side auto-login that survives restarts, add them
      # manually via the Render dashboard.

      # AI report drafting (DeepSeek or compatible). Leave AI_API_KEY blank to use deterministic
      # template fallback reports. AI_PROVIDER e.g. "deepseek". AI_MODEL e.g. "deepseek-v4-pro".
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      # JSON array of allowed origins, e.g. ["https://ucmb-dqa-frontend.onrender.com"]
      - key: CORS_ORIGINS
        sync: false
      # First-manager seed. Set SEED_DEFAULT_MANAGER to "true" on the first deploy so the
      # backend lifespan creates this manager if the email is not yet present in the DB.
      # Change the password immediately after first sign-in. After that you can set
      # SEED_DEFAULT_MANAGER back to "false" and redeploy.
      - key: SEED_DEFAULT_MANAGER
        sync: false
      - key: DEFAULT_MANAGER_NAME
        sync: false
      - key: DEFAULT_MANAGER_EMAIL
        sync: false
      - key: DEFAULT_MANAGER_PASSWORD
        sync: false

  - type: web
    name: ucmb-dqa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Set to the public URL of the backend service plus /api,
      # e.g. https://ucmb-dqa-backend.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
