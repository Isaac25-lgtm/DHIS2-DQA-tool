services:
  - type: web
    name: ucmb-dqa-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: UCMB HMIS 105 DQA Platform
      - key: APP_VERSION
        value: 0.6.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ucmb-dqa-postgres
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: DHIS2_BASE_URL
        value: https://hmis.health.go.ug/api
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEFAULT_MANAGER
        value: false

  - type: web
    name: ucmb-dqa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ucmb-dqa-postgres
    databaseName: ucmb_dqa
    user: ucmb_dqa
