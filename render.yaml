# Single-service Render Blueprint for the UCMB HMIS 105 DQA Platform.
#
# One Render web service builds the React frontend, runs Alembic migrations,
# starts FastAPI, and serves both:
# - frontend routes from /
# - backend API routes from /api
#
# Database is EXTERNAL Neon Postgres. Provide the full Neon pooled connection
# string, including ?sslmode=require, through DATABASE_URL.

services:
  - type: web
    name: ucmb-dqa-platform
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: APP_NAME
        value: "UCMB HMIS 105 DQA Platform"
      - key: APP_VERSION
        value: "0.6.0"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DHIS2_BASE_URL
        value: "https://hmis.health.go.ug/api"
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      # Same-origin deployment uses /api, so no frontend service URL is needed.
      - key: VITE_API_BASE_URL
        value: "/api"
      # Same-origin browser traffic does not need CORS. Keep this empty unless
      # you later add a separate frontend domain.
      - key: CORS_ORIGINS
        value: "[]"
      # First-manager seed. Temporarily set SEED_DEFAULT_MANAGER=true with a
      # strong DEFAULT_MANAGER_PASSWORD on first deploy, then set it back false.
      - key: SEED_DEFAULT_MANAGER
        sync: false
      - key: DEFAULT_MANAGER_NAME
        sync: false
      - key: DEFAULT_MANAGER_EMAIL
        sync: false
      - key: DEFAULT_MANAGER_PASSWORD
        sync: false
